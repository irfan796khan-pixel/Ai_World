<script>
// ============================================================================
// AI World — ONLY the girl and the room.
// Brain, voice, chat, moves, memory, server = left out on purpose (partners add them).
// Room code is copied from index.html (same sizes, colors, places).
// ============================================================================
const statusEl = document.getElementById('status');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbeafe);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.0, 4.7);

  ball:   { x: -1.6, z: 1.6, name: "Ball" },

// ============================================================================

const room = new THREE.Group();
scene.add(room);

rug.position.set(0, 0.01, 0); rug.receiveShadow = true; room.add(rug);

// walls + window

winFrame.position.set(-3, 3.2, -5.95); room.add(winFrame);
const winGlass = new THREE.Mesh(new THREE.BoxGeometry(2.9, 1.9, 0.27), new THREE.MeshBasicMaterial({ color: 0xe0f2fe }));
winGlass.position.set(-3, 3.2, -5.95); room.add(winGlass);

// sofa, coffee table, plant
const sofaMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });
const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.45, 1.2), sofaMat);
sofaBase.position.set(2.2, 0.225, -4.6); sofaBase.castShadow = true; room.add(sofaBase);
const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.95, 0.3), sofaMat);
sofaBack.position.set(2.2, 0.6, -5.05); sofaBack.castShadow = true; room.add(sofaBack);
const table = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.42, 0.9), new THREE.MeshStandardMaterial({ color: 0x78350f }));
table.position.set(2.2, 0.21, -2.8); table.castShadow = true; room.add(table);
const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.5, 16), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
pot.position.set(-5.2, 0.25, -4.5); pot.castShadow = true; room.add(pot);
const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), new THREE.MeshStandardMaterial({ color: 0x15803d }));
leaves.position.set(-5.2, 0.85, -4.5); leaves.castShadow = true; room.add(leaves);

// floor lamp (off) + whiteboard (blank)
const lampPole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 1.7, 10), new THREE.MeshStandardMaterial({ color: 0x334155 }));
lampPole.position.set(5.4, 0.85, -5.3); room.add(lampPole);
const lampBulb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), new THREE.MeshStandardMaterial({ color: 0xfef3c7, emissive: 0xfbbf24, emissiveIntensity: 0.2 }));
lampBulb.position.set(5.4, 1.8, -5.3); room.add(lampBulb);
const lampLight = new THREE.PointLight(0xffd27a, 0, 9, 2); lampLight.position.set(5.4, 1.8, -5.3); room.add(lampLight);
const boardCanvas = document.createElement('canvas'); boardCanvas.width = 1024; boardCanvas.height = 512;
{ const c = boardCanvas.getContext('2d'); c.fillStyle = '#f8fafc'; c.fillRect(0, 0, 1024, 512); }
const boardTex = new THREE.CanvasTexture(boardCanvas);
const board = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.5), new THREE.MeshStandardMaterial({ map: boardTex, roughness: 0.9 }));
board.position.set(1.2, 2.6, -5.84); room.add(board);
const boardFrame = new THREE.Mesh(new THREE.BoxGeometry(3.15, 1.65, 0.05), new THREE.MeshStandardMaterial({ color: 0x475569 }));
boardFrame.position.set(1.2, 2.6, -5.9); room.add(boardFrame);

// TV (off), ball, glass, book
const tvCanvas = document.createElement('canvas'); tvCanvas.width = 768; tvCanvas.height = 432;
{ const c = tvCanvas.getContext('2d'); c.fillStyle = '#111827'; c.fillRect(0, 0, 768, 432); }
const tvTex = new THREE.CanvasTexture(tvCanvas);
const tvFrame = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.35, 2.3), new THREE.MeshStandardMaterial({ color: 0x0f172a })); tvFrame.position.set(-6.85, 1.9, 0); room.add(tvFrame);
const tv = new THREE.Mesh(new THREE.PlaneGeometry(2.15, 1.2), new THREE.MeshBasicMaterial({ map: tvTex })); tv.position.set(-6.8, 1.9, 0); tv.rotation.y = Math.PI / 2; room.add(tv);
const tvStand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 2.0), new THREE.MeshStandardMaterial({ color: 0x334155 })); tvStand.position.set(-6.6, 0.3, 0); room.add(tvStand);
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 20), new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.5 })); ball.position.set(-1.6, 0.16, 1.6); ball.castShadow = true; room.add(ball);
const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.16, 12), new THREE.MeshStandardMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.7 })); glass.position.set(1.7, 0.5, -2.8); room.add(glass);
const book = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.05, 0.24), new THREE.MeshStandardMaterial({ color: 0x7c3aed })); book.position.set(2.6, 0.445, -2.7); book.rotation.y = 0.3; room.add(book);
glass.castShadow = true; book.castShadow = true;

// ---------------------------------------------------------------- simple physics for small things (they fall, bounce, roll, break)
const GRAVITY = 9.8;
const props = [];
const shards = [];
function addProp(mesh, opts) {
  const p = Object.assign({
    mesh, r: 0.1, bounce: 0.35, breakable: false, roll: false, flat: false,
    v: new THREE.Vector3(), w: new THREE.Vector3(), sleep: true, broken: false,
    home: { pos: mesh.position.clone(), rot: mesh.rotation.clone() }
  }, opts);
  props.push(p);
  return p;
}
const ballProp = addProp(ball, { r: 0.16, bounce: 0.55, roll: true });
const glassProp = addProp(glass, { r: 0.07, bounce: 0.2, breakable: true });
const bookProp = addProp(book, { r: 0.025, bounce: 0.1, flat: true });
// height of whatever is under a point (floor, coffee table, sofa seat, TV stand)
function supportY(x, z) {
  if (x > TBL.rect.x0 && x < TBL.rect.x1 && z > TBL.rect.z0 && z < TBL.rect.z1) return 0.42;   // coffee table (moves when she flips it)
  if (x > 0.5 && x < 3.9 && z > -5.2 && z < -4.0) return 0.45;
  if (x > -6.85 && x < -6.35 && z > -1.0 && z < 1.0) return 0.6;
  return 0;
}
function pushProp(p, vx, vy, vz, spin = 6) {
  if (p.broken) return;
  p.v.set(vx, vy, vz);
  p.w.set((Math.random() - 0.5) * spin, (Math.random() - 0.5) * spin, (Math.random() - 0.5) * spin);
  p.sleep = false;
}
function shatter(p) {
  sfx('shatter');
  p.mesh.visible = false; p.sleep = true; p.broken = true;
  const mat = new THREE.MeshStandardMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.85 });
  for (let i = 0; i < 10; i++) {
    const s = new THREE.Mesh(new THREE.TetrahedronGeometry(0.02 + Math.random() * 0.025), mat);
    s.position.copy(p.mesh.position); s.castShadow = true; room.add(s);
    const sp = addProp(s, { r: 0.015, bounce: 0.3 });
    const ang = Math.random() * Math.PI * 2, speed = 0.6 + Math.random() * 1.4;
    sp.v.set(Math.cos(ang) * speed, 0.8 + Math.random() * 1.2, Math.sin(ang) * speed);
    sp.w.set(Math.random() * 20 - 10, Math.random() * 20 - 10, Math.random() * 20 - 10);
    sp.sleep = false;
    shards.push(sp);
  }
}
function resetProps() {
  for (const s of shards) { room.remove(s.mesh); const i = props.indexOf(s); if (i >= 0) props.splice(i, 1); }
  shards.length = 0;
  for (const p of props) {
    p.mesh.position.copy(p.home.pos); p.mesh.rotation.copy(p.home.rot); p.mesh.visible = true;
    p.v.set(0, 0, 0); p.w.set(0, 0, 0); p.sleep = true; p.broken = false;
  }
  sassReset();
}
function physicsTick(dt) {
  // walking into the ball kicks it
  if (typeof act !== 'undefined' && act.walking && !ballProp.broken) {
    const dx = ball.position.x - girl.position.x, dz = ball.position.z - girl.position.z, d = Math.hypot(dx, dz);
    if (d > 0.01 && d < 0.4 && ball.position.y < 0.3 && ballProp.v.lengthSq() < 0.5) { pushProp(ballProp, dx / d * 2.4, 1.1, dz / d * 2.4, 0); sassStub(); }
  }
  for (const p of props) {
    if (p.sleep) continue;
    const m = p.mesh;
    p.v.y -= GRAVITY * dt;
    m.position.addScaledVector(p.v, dt);
    if (m.position.x < -6.7) { m.position.x = -6.7; p.v.x *= -0.5; }
    if (m.position.x > 6.7) { m.position.x = 6.7; p.v.x *= -0.5; }
    if (m.position.z < -5.8) { m.position.z = -5.8; p.v.z *= -0.5; }
    if (m.position.z > 6.7) { m.position.z = 6.7; p.v.z *= -0.5; }
    const ground = supportY(m.position.x, m.position.z) + p.r;
    let onGround = false;
    if (m.position.y <= ground) {
      onGround = true;
      if (p.breakable && p.v.y < -2.0) { m.position.y = ground; shatter(p); continue; }
      m.position.y = ground;
      if (p.v.y < -0.4) {                       // hit the ground: bounce
        p.v.y = -p.v.y * p.bounce; p.v.x *= 0.85; p.v.z *= 0.85; p.w.multiplyScalar(0.6);
      } else {                                  // resting on it: slide / roll to a stop
        p.v.y = 0;
        const f = Math.max(0, 1 - (p.roll ? 0.9 : 6) * dt);
        p.v.x *= f; p.v.z *= f; p.w.multiplyScalar(Math.max(0, 1 - 6 * dt));
        if (p.v.lengthSq() < 0.003) {
          p.v.set(0, 0, 0); p.sleep = true;
          if (p.flat) { m.rotation.x = 0; m.rotation.z = 0; }
        }
      }
    }
    if (p.roll && onGround) { m.rotation.x += p.v.z / p.r * dt; m.rotation.z -= p.v.x / p.r * dt; }
    else { m.rotation.x += p.w.x * dt; m.rotation.y += p.w.y * dt; m.rotation.z += p.w.z * dt; }
  }
}

// ============================================================================
// 2. THE GIRL (Girl_character_mixamo.glb, same folder)
// ============================================================================
const girl = new THREE.Group();          // move/rotate this group to move her
girl.rotation.order = 'YXZ';             // turn (y) first, then lean (x) in her own frame
scene.add(girl);
const bones = {};                        // bones by name; three.js drops dots: 'upper_arm.L' is bones['upper_armL']
const morphMeshes = [];                  // meshes with face shapes (jawOpen, eyeBlinkLeft, ...)
const rest = {};                         // rest rotation of each bone
let loaded = false;

function setMorph(name, v) {
  for (const m of morphMeshes) { const i = m.morphTargetDictionary[name]; if (i !== undefined) m.morphTargetInfluences[i] = v; }
}

// turn a bone so the direction from it to its child points along "want" (world space)
function aimBone(bone, child, want) {
  bone.updateMatrixWorld(true);
  const a = bone.getWorldPosition(new THREE.Vector3()), b = child.getWorldPosition(new THREE.Vector3());
  const have = b.sub(a).normalize();
  const qWorld = new THREE.Quaternion().setFromUnitVectors(have, want.clone().normalize());
  const parentQ = bone.parent.getWorldQuaternion(new THREE.Quaternion());
  const boneQ = bone.getWorldQuaternion(new THREE.Quaternion());
  const newWorld = qWorld.multiply(boneQ);
  bone.quaternion.copy(parentQ.invert().multiply(newWorld));
  bone.updateMatrixWorld(true);
}

// Size of the body as it is drawn (bones applied). Box3.setFromObject reads the raw vertex numbers, which are
// small whole numbers in the packed file, so it would size her wrong. Same result for the packed and the original file.
function skinnedBox(root) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3();
  root.traverse(m => {
    if (!m.isMesh) return;
    if (!m.isSkinnedMesh) { box.expandByObject(m); return; }
    const g = m.geometry, P = g.attributes.position, I = g.attributes.skinIndex, Wt = g.attributes.skinWeight;
    const den = (a) => !a.normalized ? 1 : a.array instanceof Int8Array ? 127 : a.array instanceof Uint8Array ? 255 : a.array instanceof Int16Array ? 32767 : a.array instanceof Uint16Array ? 65535 : 1;
    // three.js r147 getX() already turns packed 0..255 numbers into 0..1, so do NOT divide again (that made her 255x too big)
    const pn = 1, wn = 1;
    const mats = m.skeleton.bones.map((b, k) => new THREE.Matrix4().multiplyMatrices(b.matrixWorld, m.skeleton.boneInverses[k]).multiply(m.bindMatrix));
    const v = new THREE.Vector3(), o = new THREE.Vector3(), t = new THREE.Vector3();
    const step = Math.max(1, Math.floor(P.count / 40000));
    for (let i = 0; i < P.count; i += step) {
      v.set(P.getX(i) / pn, P.getY(i) / pn, P.getZ(i) / pn); o.set(0, 0, 0);
      const w = [Wt.getX(i), Wt.getY(i), Wt.getZ(i), Wt.getW(i)], j = [I.getX(i), I.getY(i), I.getZ(i), I.getW(i)];
      for (let c = 0; c < 4; c++) if (w[c]) o.addScaledVector(t.copy(v).applyMatrix4(mats[j[c]]), w[c] / wn);
      box.expandByPoint(o);
    }
  });
  return box;
}
function onGirl(gltf) {
  const obj = gltf.scene;
  // same size rule as index.html: biggest side = 1.9, feet on the floor, centered
  const box = skinnedBox(obj);
  const size = box.getSize(new THREE.Vector3());
  obj.scale.setScalar(1.9 / Math.max(size.x, size.y, size.z));
  obj.updateMatrixWorld(true);
  const sBox = skinnedBox(obj);
  const c = sBox.getCenter(new THREE.Vector3());
  obj.position.set(-c.x, -sBox.min.y, -c.z);
  obj.traverse(o => {
    if (o.isBone) bones[o.name] = o;
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      if (o.morphTargetDictionary) morphMeshes.push(o);
    }
  });
  // The model's face points to -Z, but all the code here treats +Z as "forward"
  // (walking, facing spots, facing the camera). Turn the model around once so they agree.
  const holder = new THREE.Group();
  holder.rotation.y = Math.PI;
  holder.add(obj);
  girl.add(holder);
  girl.updateMatrixWorld(true);
  captureTPose();                         // her T-pose, before the arms are relaxed (the Mixamo clips start from a T-pose too)

  // relax the arms out of the T-pose (about 15 degrees from the body)
  const down = 0.26;
  if (bones['upper_armL'] && bones['forearmL']) {
    const sideL = Math.sign(bones['forearmL'].getWorldPosition(new THREE.Vector3()).x - bones['upper_armL'].getWorldPosition(new THREE.Vector3()).x) || 1;
    aimBone(bones['upper_armL'], bones['forearmL'], new THREE.Vector3(sideL * Math.sin(down), -Math.cos(down), 0));
  }
  if (bones['upper_armR'] && bones['forearmR']) {
    const sideR = Math.sign(bones['forearmR'].getWorldPosition(new THREE.Vector3()).x - bones['upper_armR'].getWorldPosition(new THREE.Vector3()).x) || -1;
    aimBone(bones['upper_armR'], bones['forearmR'], new THREE.Vector3(sideR * Math.sin(down), -Math.cos(down), 0));
  }
  for (const n in bones) rest[n] = bones[n].quaternion.clone();
  prepareWave();
  prepareClumsy();
  prepareHands();

  loaded = true;
  prepareMocap();                         // starts the Mixamo clips if moves.json is already here (else when it arrives)
  statusEl.textContent = '';
  window.AIWorld.ready = true;
}
// The packed file (14 MB, meshopt) loads about 4x faster than the original (63 MB). Same mesh, bones and 31 face shapes.
// Girl_Room.html?model=original forces the big file.
const MODEL_FILES = /model=original/.test(location.search) ? ['Girl_character_mixamo.glb'] : ['Girl_character_mixamo_packed.glb', 'Girl_character_mixamo.glb'];
const gltfLoader = new THREE.GLTFLoader();
if (window.MeshoptDecoder) gltfLoader.setMeshoptDecoder(window.MeshoptDecoder);
function loadGirl(i) {
  statusEl.textContent = 'loading the girl… (' + MODEL_FILES[i] + ')';
  gltfLoader.load(MODEL_FILES[i], (g) => { window.AIWorld.modelFile = MODEL_FILES[i]; onGirl(g); }, undefined, (err) => {
    if (i + 1 < MODEL_FILES.length) { console.warn('could not load ' + MODEL_FILES[i] + ', trying ' + MODEL_FILES[i + 1], err); return loadGirl(i + 1); }
    console.error(err);
    statusEl.textContent = 'Could not load Girl_character_mixamo.glb. Start with run_girl_room.bat (not by double-clicking the html).';
  });
}
loadGirl(0);

// ---------------------------------------------------------------- small idle life: breathing + blinking
const clock = new THREE.Clock();
const tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler();
function addRot(name, x, y, z) {
  const b = bones[name]; if (!b || !rest[name]) return;
  tmpQ.setFromEuler(tmpE.set(x, y, z));
  b.quaternion.copy(rest[name]).multiply(tmpQ);
}
function idleTick(t, dt) {
  if (!loaded || window.AIWorld.idle === false) return;
  const br = Math.sin(t * 1.6);                       // breathing
  addRot('spine002', 0.012 * br, 0, 0);
  // slow head sway + head moves from the face system (nods while talking, nod / shake gestures, tilt for "confused")
  addRot('spine004', 0.015 * Math.sin(t * 0.5) + FX.headX, 0.03 * Math.sin(t * 0.37) + FX.headY, FX.headZ);
  // blinking now lives in faceTick (section 2b)
}

// ============================================================================
// 2b. THE FACE — four layers mixed every frame, so she looks alive and human:
//   1. mood     the brain's emotion as a soft face (fades in/out, never 100%)
//   2. alive    natural blinks (sometimes double), tiny face movement, a little uneven
//   3. talking  mouth, brows and head follow her voice (loudness + sound type)
//   4. action   the clumsy moves (trip, sit, knock, TV scare) set their own face on top
// Her model has 31 face shapes (28 ARKit names + mouthUpperUp, mouthLowerDown, mouthShrugLower) and a real mouth (slit lips, teeth, tongue). "Left" shapes sit on the +x side of the model.
// ============================================================================

  const isWalk = e.actions.some(x => x.walk !== undefined);
  STATS.cmdTimes = STATS.cmdTimes.filter(x => now - x < 30); STATS.cmdTimes.push(now);
  let add = 9 + 5 * (STATS.cmdTimes.length - 1);                            // orders in a row add up
  if (e.match[0] === STATS.lastCmd && now - STATS.lastCmdT < 20) add += 8;  // the same order again
  if (/\b(please|pls|plz)\b/.test(q)) add -= 10;                            // manners help
  STATS.annoy = clampS(STATS.annoy + add * STATS.sass); STATS.focus = clampS(STATS.focus - 8);
  STATS.lastCmd = e.match[0]; STATS.lastCmdT = now;
  if (isWalk) { STATS.walkTimes = STATS.walkTimes.filter(x => now - x < 45); STATS.walkTimes.push(now); }
  let d = 'obey';
  if (isWalk && (STATS.walkTimes.length >= 4 || (STATS.annoy > 60 && STATS.walkTimes.length >= 2))) d = 'hostage';
  else if (STATS.annoy > 75) d = pick(STATS.wild ? ['cross', 'tap', 'throw'] : ['cross', 'cross', 'tap']);
  else if (STATS.energy < 15 && (isWalk || e.tag === 'funny')) d = 'tired';
  if (d === 'obey') return false;
  window.AIWorld.stop();
  if (d === 'hostage') { STATS.walkTimes = []; window.AIWorld.act([{ hostage: 'glass' }]); }
  else if (d === 'tired') { setMood('unimpressed', 1, 4); say(pick(LINES.tired)); window.AIWorld.act([{ sit: 'sofa', time: 10 }]); }
  else { window.AIWorld.act([{ rebel: d }]); STATS.annoy = clampS(STATS.annoy - 40); }
  return true;
}
function autoTick() {
  if (!STATS.auto || !loaded || act.cur || act.queue.length || STATS.hostage || FX.talking) return;
  const now = STATS.now, idleFor = now - STATS.lastInput;
  if (idleFor < 8 || now < STATS.nextAuto) return;
  STATS.nextAuto = now + 8 + Math.random() * 8;
  if (STATS.energy < 25) { say(pick(LINES.yawn)); setMood('unimpressed', 0.6, 4); window.AIWorld.act([{ sit: 'sofa', time: 14 }]); return; }
  if (STATS.annoy > 55) { window.AIWorld.act([{ rebel: 'cross', quiet: true }]); return; }
  if (idleFor > 25 || STATS.focus < 40) {
    const r = Math.random();
    if (r < 0.25) { say(pick(LINES.bored)); window.AIWorld.act([{ walk: 'window' }, { wait: 2 }, { face: 'camera' }]); }
    else if (r < 0.45) window.AIWorld.act([{ walk: 'plant' }, { wait: 1.5 }, { walk: 'center' }, { face: 'camera' }]);
    else if (r < 0.6) { window.AIWorld.act([{ walk: 'tv' }, { tv: pick(['Cartoons', 'News: nothing happened', 'Cat videos']) }, { wait: 2 }]); }
    else if (r < 0.75) { window.AIWorld.act([{ board: pick(["I'm bored", 'Day 47 in this room', 'Note: buy more furniture']) }]); }
    else window.AIWorld.act([{ walk: 'ball' }, { face: 'camera' }]);
    return;
  }
  if (STATS.mood > 65 && STATS.energy > 50) { say(pick(LINES.happy)); window.AIWorld.act([{ face: 'camera' }, { wave: 1.5 }]); }
}

// ---------------------------------------------------------------- small stats panel (top right)
const hud = document.createElement('div');
hud.style.cssText = 'position:absolute;top:12px;right:12px;z-index:10;background:rgba(15,23,42,.72);color:#e2e8f0;padding:8px 10px;border-radius:12px;font:12px Consolas,monospace;pointer-events:none;min-width:150px';
document.body.appendChild(hud);
let hudT = 0;
function hudTick(dt) {
  hudT -= dt; if (hudT > 0) return; hudT = 0.25;
  if (!STATS.showHud) { hud.style.display = 'none'; return; } hud.style.display = '';
  const bar = (v, col) => `<span style="display:inline-block;width:70px;height:7px;background:#334155;border-radius:4px;vertical-align:middle"><span style="display:block;width:${v * 0.7}px;height:7px;background:${col};border-radius:4px"></span></span>`;
  hud.innerHTML = `Energy ${bar(STATS.energy, '#22c55e')}<br>Mood&nbsp;&nbsp; ${bar(STATS.mood, '#facc15')}<br>Focus&nbsp; ${bar(STATS.focus, '#38bdf8')}<br>Annoyed ${bar(STATS.annoy, '#ef4444')}`;
}
STATS.showHud = true;
Object.assign(window.AIWorld, {
  stats: () => ({ energy: Math.round(STATS.energy), mood: Math.round(STATS.mood), focus: Math.round(STATS.focus), annoyed: Math.round(STATS.annoy), hostage: !!STATS.hostage, tantrum: inTantrum() }),
  setStats(o) { for (const k of ['energy', 'mood', 'focus']) if (o[k] !== undefined) STATS[k] = clampS(o[k]); if (o.annoyed !== undefined) STATS.annoy = clampS(o.annoyed); },
  sassy(v) { STATS.sass = Math.max(0, Math.min(2, +v)); },
  wild(v) { STATS.wild = !!v; },                               // AIWorld.wild(true) brings back the big tantrums     // 0 = obeys everything, 1 = normal, 2 = extra rebellious
  autonomous(on) { STATS.auto = !!on; },
  showStats(on) { STATS.showHud = !!on; },
  build: (text) => { const b = parseBuild(text); if (b) build(b); return !!b; },
  clearSpawned, sfx, beforeRender: [shakeBefore]
});
window.AIWorld.afterRender.push(shakeAfter);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  mocapTick(t, dt);
  idleTick(t, dt);
  actionTick(t, dt);
  limbsTick(t, dt);
  clumsyTick(t, dt);
  handsAndTurnTick(t, dt);
  sassTick(t, dt);
  faceTick(t, dt);
  physicsTick(dt);
  for (const f of window.AIWorld.onFrame) { try { f(t, dt); } catch (e) { console.error(e); } }
  controls.update();
  for (const f of window.AIWorld.beforeRender || []) { try { f(); } catch (e) { console.error(e); } }
  renderer.render(scene, camera);
  for (const f of window.AIWorld.afterRender) { try { f(); } catch (e) { console.error(e); } }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
