<script>
// ============================================================================
// AI World — ONLY the girl and the room.

// ============================================================================
const statusEl = document.getElementById('status');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbeafe);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.0, 4.7);

  ball:   { x: -1.6, z: 1.6, name: "Ball" },

// ============================================================================

const room = new THREE.Group();
scene.add(room);

// floor + rug

rug.position.set(0, 0.01, 0); rug.receiveShadow = true; room.add(rug);

// walls + window

winFrame.position.set(-3, 3.2, -5.95); room.add(winFrame);
const winGlass = new THREE.Mesh(new THREE.BoxGeometry(2.9, 1.9, 0.27), new THREE.MeshBasicMaterial({ color: 0xe0f2fe }));
winGlass.position.set(-3, 3.2, -5.95); room.add(winGlass);

// sofa, coffee table, plant
const sofaMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });
const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.45, 1.2), sofaMat);
sofaBase.position.set(2.2, 0.225, -4.6); sofaBase.castShadow = true; room.add(sofaBase);
const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.95, 0.3), sofaMat);
sofaBack.position.set(2.2, 0.6, -5.05); sofaBack.castShadow = true; room.add(sofaBack);
const table = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.42, 0.9), new THREE.MeshStandardMaterial({ color: 0x78350f }));
table.position.set(2.2, 0.21, -2.8); table.castShadow = true; room.add(table);
const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.5, 16), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
pot.position.set(-5.2, 0.25, -4.5); pot.castShadow = true; room.add(pot);
const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), new THREE.MeshStandardMaterial({ color: 0x15803d }));
leaves.position.set(-5.2, 0.85, -4.5); leaves.castShadow = true; room.add(leaves);

// floor lamp (off) + whiteboard (blank)
const lampPole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 1.7, 10), new THREE.MeshStandardMaterial({ color: 0x334155 }));
lampPole.position.set(5.4, 0.85, -5.3); room.add(lampPole);
const lampBulb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), new THREE.MeshStandardMaterial({ color: 0xfef3c7, emissive: 0xfbbf24, emissiveIntensity: 0.2 }));
lampBulb.position.set(5.4, 1.8, -5.3); room.add(lampBulb);
const lampLight = new THREE.PointLight(0xffd27a, 0, 9, 2); lampLight.position.set(5.4, 1.8, -5.3); room.add(lampLight);
const boardCanvas = document.createElement('canvas'); boardCanvas.width = 1024; boardCanvas.height = 512;
{ const c = boardCanvas.getContext('2d'); c.fillStyle = '#f8fafc'; c.fillRect(0, 0, 1024, 512); }
const boardTex = new THREE.CanvasTexture(boardCanvas);
const board = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.5), new THREE.MeshStandardMaterial({ map: boardTex, roughness: 0.9 }));
board.position.set(1.2, 2.6, -5.84); room.add(board);
const boardFrame = new THREE.Mesh(new THREE.BoxGeometry(3.15, 1.65, 0.05), new THREE.MeshStandardMaterial({ color: 0x475569 }));
boardFrame.position.set(1.2, 2.6, -5.9); room.add(boardFrame);

// TV (off), ball, glass, book
const tvCanvas = document.createElement('canvas'); tvCanvas.width = 768; tvCanvas.height = 432;
{ const c = tvCanvas.getContext('2d'); c.fillStyle = '#111827'; c.fillRect(0, 0, 768, 432); }
const tvTex = new THREE.CanvasTexture(tvCanvas);
const tvFrame = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.35, 2.3), new THREE.MeshStandardMaterial({ color: 0x0f172a })); tvFrame.position.set(-6.85, 1.9, 0); room.add(tvFrame);
const tv = new THREE.Mesh(new THREE.PlaneGeometry(2.15, 1.2), new THREE.MeshBasicMaterial({ map: tvTex })); tv.position.set(-6.8, 1.9, 0); tv.rotation.y = Math.PI / 2; room.add(tv);
const tvStand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 2.0), new THREE.MeshStandardMaterial({ color: 0x334155 })); tvStand.position.set(-6.6, 0.3, 0); room.add(tvStand);
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 20), new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.5 })); ball.position.set(-1.6, 0.16, 1.6); ball.castShadow = true; room.add(ball);
const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.16, 12), new THREE.MeshStandardMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.7 })); glass.position.set(1.7, 0.5, -2.8); room.add(glass);
const book = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.05, 0.24), new THREE.MeshStandardMaterial({ color: 0x7c3aed })); book.position.set(2.6, 0.445, -2.7); book.rotation.y = 0.3; room.add(book);
glass.castShadow = true; book.castShadow = true;

// ---------------------------------------------------------------- simple physics for small things (they fall, bounce, roll, break)
const GRAVITY = 9.8;
const props = [];
const shards = [];
function addProp(mesh, opts) {
  const p = Object.assign({
    mesh, r: 0.1, bounce: 0.35, breakable: false, roll: false, flat: false,
    v: new THREE.Vector3(), w: new THREE.Vector3(), sleep: true, broken: false,
    home: { pos: mesh.position.clone(), rot: mesh.rotation.clone() }
  }, opts);
  props.push(p);
  return p;
}
const ballProp = addProp(ball, { r: 0.16, bounce: 0.55, roll: true });
const glassProp = addProp(glass, { r: 0.07, bounce: 0.2, breakable: true });
const bookProp = addProp(book, { r: 0.025, bounce: 0.1, flat: true });
// height of whatever is under a point (floor, coffee table, sofa seat, TV stand)
function supportY(x, z) {
  if (x > TBL.rect.x0 && x < TBL.rect.x1 && z > TBL.rect.z0 && z < TBL.rect.z1) return 0.42;   // coffee table (moves when she flips it)
  if (x > 0.5 && x < 3.9 && z > -5.2 && z < -4.0) return 0.45;
  if (x > -6.85 && x < -6.35 && z > -1.0 && z < 1.0) return 0.6;
  return 0;
}
function pushProp(p, vx, vy, vz, spin = 6) {
  if (p.broken) return;
  p.v.set(vx, vy, vz);
  p.w.set((Math.random() - 0.5) * spin, (Math.random() - 0.5) * spin, (Math.random() - 0.5) * spin);
  p.sleep = false;
}
function shatter(p) {
  sfx('shatter');
  p.mesh.visible = false; p.sleep = true; p.broken = true;
  const mat = new THREE.MeshStandardMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.85 });
  for (let i = 0; i < 10; i++) {
    const s = new THREE.Mesh(new THREE.TetrahedronGeometry(0.02 + Math.random() * 0.025), mat);
    s.position.copy(p.mesh.position); s.castShadow = true; room.add(s);
    const sp = addProp(s, { r: 0.015, bounce: 0.3 });
    const ang = Math.random() * Math.PI * 2, speed = 0.6 + Math.random() * 1.4;
    sp.v.set(Math.cos(ang) * speed, 0.8 + Math.random() * 1.2, Math.sin(ang) * speed);
    sp.w.set(Math.random() * 20 - 10, Math.random() * 20 - 10, Math.random() * 20 - 10);
    sp.sleep = false;
    shards.push(sp);
  }
}
function resetProps() {
  for (const s of shards) { room.remove(s.mesh); const i = props.indexOf(s); if (i >= 0) props.splice(i, 1); }
  shards.length = 0;
  for (const p of props) {
    p.mesh.position.copy(p.home.pos); p.mesh.rotation.copy(p.home.rot); p.mesh.visible = true;
    p.v.set(0, 0, 0); p.w.set(0, 0, 0); p.sleep = true; p.broken = false;
  }
  sassReset();
}
function physicsTick(dt) {
  // walking into the ball kicks it
  if (typeof act !== 'undefined' && act.walking && !ballProp.broken) {
    const dx = ball.position.x - girl.position.x, dz = ball.position.z - girl.position.z, d = Math.hypot(dx, dz);
    if (d > 0.01 && d < 0.4 && ball.position.y < 0.3 && ballProp.v.lengthSq() < 0.5) { pushProp(ballProp, dx / d * 2.4, 1.1, dz / d * 2.4, 0); sassStub(); }
  }
  for (const p of props) {
    if (p.sleep) continue;
    const m = p.mesh;
    p.v.y -= GRAVITY * dt;
    m.position.addScaledVector(p.v, dt);
    if (m.position.x < -6.7) { m.position.x = -6.7; p.v.x *= -0.5; }
    if (m.position.x > 6.7) { m.position.x = 6.7; p.v.x *= -0.5; }
    if (m.position.z < -5.8) { m.position.z = -5.8; p.v.z *= -0.5; }
    if (m.position.z > 6.7) { m.position.z = 6.7; p.v.z *= -0.5; }
    const ground = supportY(m.position.x, m.position.z) + p.r;
    let onGround = false;
    if (m.position.y <= ground) {
      onGround = true;
      if (p.breakable && p.v.y < -2.0) { m.position.y = ground; shatter(p); continue; }
      m.position.y = ground;
      if (p.v.y < -0.4) {                       // hit the ground: bounce
        p.v.y = -p.v.y * p.bounce; p.v.x *= 0.85; p.v.z *= 0.85; p.w.multiplyScalar(0.6);
      } else {                                  // resting on it: slide / roll to a stop
        p.v.y = 0;
        const f = Math.max(0, 1 - (p.roll ? 0.9 : 6) * dt);
        p.v.x *= f; p.v.z *= f; p.w.multiplyScalar(Math.max(0, 1 - 6 * dt));
        if (p.v.lengthSq() < 0.003) {
          p.v.set(0, 0, 0); p.sleep = true;
          if (p.flat) { m.rotation.x = 0; m.rotation.z = 0; }
        }
      }
    }
    if (p.roll && onGround) { m.rotation.x += p.v.z / p.r * dt; m.rotation.z -= p.v.x / p.r * dt; }
    else { m.rotation.x += p.w.x * dt; m.rotation.y += p.w.y * dt; m.rotation.z += p.w.z * dt; }
  }
}

// ============================================================================
// 2. THE GIRL (Girl_character_mixamo.glb, same folder)
// ============================================================================
const girl = new THREE.Group();          // move/rotate this group to move her
girl.rotation.order = 'YXZ';             // turn (y) first, then lean (x) in her own frame
scene.add(girl);
const bones = {};                        // bones by name; three.js drops dots: 'upper_arm.L' is bones['upper_armL']
const morphMeshes = [];                  // meshes with face shapes (jawOpen, eyeBlinkLeft, ...)
const rest = {};                         // rest rotation of each bone
let loaded = false;

function setMorph(name, v) {
  for (const m of morphMeshes) { const i = m.morphTargetDictionary[name]; if (i !== undefined) m.morphTargetInfluences[i] = v; }
}

// turn a bone so the direction from it to its child points along "want" (world space)
function aimBone(bone, child, want) {
  bone.updateMatrixWorld(true);
  const a = bone.getWorldPosition(new THREE.Vector3()), b = child.getWorldPosition(new THREE.Vector3());
  const have = b.sub(a).normalize();
  const qWorld = new THREE.Quaternion().setFromUnitVectors(have, want.clone().normalize());
  const parentQ = bone.parent.getWorldQuaternion(new THREE.Quaternion());
  const boneQ = bone.getWorldQuaternion(new THREE.Quaternion());
  const newWorld = qWorld.multiply(boneQ);
  bone.quaternion.copy(parentQ.invert().multiply(newWorld));
  bone.updateMatrixWorld(true);
}

// Size of the body as it is drawn (bones applied). Box3.setFromObject reads the raw vertex numbers, which are
// small whole numbers in the packed file, so it would size her wrong. Same result for the packed and the original file.
function skinnedBox(root) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3();
  root.traverse(m => {
    if (!m.isMesh) return;
    if (!m.isSkinnedMesh) { box.expandByObject(m); return; }
    const g = m.geometry, P = g.attributes.position, I = g.attributes.skinIndex, Wt = g.attributes.skinWeight;
    const den = (a) => !a.normalized ? 1 : a.array instanceof Int8Array ? 127 : a.array instanceof Uint8Array ? 255 : a.array instanceof Int16Array ? 32767 : a.array instanceof Uint16Array ? 65535 : 1;
    // three.js r147 getX() already turns packed 0..255 numbers into 0..1, so do NOT divide again (that made her 255x too big)
    const pn = 1, wn = 1;
    const mats = m.skeleton.bones.map((b, k) => new THREE.Matrix4().multiplyMatrices(b.matrixWorld, m.skeleton.boneInverses[k]).multiply(m.bindMatrix));
    const v = new THREE.Vector3(), o = new THREE.Vector3(), t = new THREE.Vector3();
    const step = Math.max(1, Math.floor(P.count / 40000));
    for (let i = 0; i < P.count; i += step) {
      v.set(P.getX(i) / pn, P.getY(i) / pn, P.getZ(i) / pn); o.set(0, 0, 0);
      const w = [Wt.getX(i), Wt.getY(i), Wt.getZ(i), Wt.getW(i)], j = [I.getX(i), I.getY(i), I.getZ(i), I.getW(i)];
      for (let c = 0; c < 4; c++) if (w[c]) o.addScaledVector(t.copy(v).applyMatrix4(mats[j[c]]), w[c] / wn);
      box.expandByPoint(o);
    }
  });
  return box;
}
function onGirl(gltf) {
  const obj = gltf.scene;
  // same size rule as index.html: biggest side = 1.9, feet on the floor, centered
  const box = skinnedBox(obj);
  const size = box.getSize(new THREE.Vector3());
  obj.scale.setScalar(1.9 / Math.max(size.x, size.y, size.z));
  obj.updateMatrixWorld(true);
  const sBox = skinnedBox(obj);
  const c = sBox.getCenter(new THREE.Vector3());
  obj.position.set(-c.x, -sBox.min.y, -c.z);
  obj.traverse(o => {
    if (o.isBone) bones[o.name] = o;
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      if (o.morphTargetDictionary) morphMeshes.push(o);
    }
  });
  // The model's face points to -Z, but all the code here treats +Z as "forward"
  // (walking, facing spots, facing the camera). Turn the model around once so they agree.
  const holder = new THREE.Group();
  holder.rotation.y = Math.PI;
  holder.add(obj);
  girl.add(holder);
  girl.updateMatrixWorld(true);
  captureTPose();                         // her T-pose, before the arms are relaxed (the Mixamo clips start from a T-pose too)

  // relax the arms out of the T-pose (about 15 degrees from the body)
  const down = 0.26;
  if (bones['upper_armL'] && bones['forearmL']) {
    const sideL = Math.sign(bones['forearmL'].getWorldPosition(new THREE.Vector3()).x - bones['upper_armL'].getWorldPosition(new THREE.Vector3()).x) || 1;
    aimBone(bones['upper_armL'], bones['forearmL'], new THREE.Vector3(sideL * Math.sin(down), -Math.cos(down), 0));
  }
  if (bones['upper_armR'] && bones['forearmR']) {
    const sideR = Math.sign(bones['forearmR'].getWorldPosition(new THREE.Vector3()).x - bones['upper_armR'].getWorldPosition(new THREE.Vector3()).x) || -1;
    aimBone(bones['upper_armR'], bones['forearmR'], new THREE.Vector3(sideR * Math.sin(down), -Math.cos(down), 0));
  }
  for (const n in bones) rest[n] = bones[n].quaternion.clone();
  prepareWave();
  prepareClumsy();
  prepareHands();

  loaded = true;
  prepareMocap();                         // starts the Mixamo clips if moves.json is already here (else when it arrives)
  statusEl.textContent = '';
  window.AIWorld.ready = true;
}
// The packed file (14 MB, meshopt) loads about 4x faster than the original (63 MB). Same mesh, bones and 31 face shapes.
// Girl_Room.html?model=original forces the big file.
const MODEL_FILES = /model=original/.test(location.search) ? ['Girl_character_mixamo.glb'] : ['Girl_character_mixamo_packed.glb', 'Girl_character_mixamo.glb'];
const gltfLoader = new THREE.GLTFLoader();
if (window.MeshoptDecoder) gltfLoader.setMeshoptDecoder(window.MeshoptDecoder);
function loadGirl(i) {
  statusEl.textContent = 'loading the girl… (' + MODEL_FILES[i] + ')';
  gltfLoader.load(MODEL_FILES[i], (g) => { window.AIWorld.modelFile = MODEL_FILES[i]; onGirl(g); }, undefined, (err) => {
    if (i + 1 < MODEL_FILES.length) { console.warn('could not load ' + MODEL_FILES[i] + ', trying ' + MODEL_FILES[i + 1], err); return loadGirl(i + 1); }
    console.error(err);
    statusEl.textContent = 'Could not load Girl_character_mixamo.glb. Start with run_girl_room.bat (not by double-clicking the html).';
  });
}
loadGirl(0);

// ---------------------------------------------------------------- small idle life: breathing + blinking
const clock = new THREE.Clock();
const tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler();
function addRot(name, x, y, z) {
  const b = bones[name]; if (!b || !rest[name]) return;
  tmpQ.setFromEuler(tmpE.set(x, y, z));
  b.quaternion.copy(rest[name]).multiply(tmpQ);
}
function idleTick(t, dt) {
  if (!loaded || window.AIWorld.idle === false) return;
  const br = Math.sin(t * 1.6);                       // breathing
  addRot('spine002', 0.012 * br, 0, 0);
  // slow head sway + head moves from the face system (nods while talking, nod / shake gestures, tilt for "confused")
  addRot('spine004', 0.015 * Math.sin(t * 0.5) + FX.headX, 0.03 * Math.sin(t * 0.37) + FX.headY, FX.headZ);
  // blinking now lives in faceTick (section 2b)
}

// ============================================================================

// ---------------------------------------------------------------- what you say changes her mood, too many orders make her rebel
function sassHear(text) {
  STATS.lastInput = STATS.now;
  if (STATS.hostage) {                                                      // she warned you: one more 'walk' and the glass dies
    if (/\b(walk|go|move|come|run|step)\b/.test(norm(text))) STATS.hostage._drop = true;   // you said it -> she drops it (that is the reason)
    else STATS.hostage._spare = true;                                        // anything else (sorry, please, hi) -> she puts it back
    return true;
  }
  if (inTantrum()) { say(pick(LINES.tantrumBusy)); return true; }
  if (sassBusy()) { say(pick(["Wait. I'm busy.", 'Hold on.', 'Shh. Not now.'])); return true; }
  const b = parseBuild(text);
  if (b) { build(b); return true; }
  const e = findQuick(text); if (!e) return false;
  const q = norm(text), now = STATS.now;
  if (e.match.includes("you're ugly")) { STATS.mood = clampS(STATS.mood - 20); STATS.annoy = clampS(STATS.annoy + 15 * STATS.sass); }
  if (e.match.includes('i love you') || e.match.includes('good job') || e.match.includes('thank you')) { STATS.mood = clampS(STATS.mood + 15); STATS.annoy = clampS(STATS.annoy - 20); }
  const isCmd = Array.isArray(e.actions) && e.actions.length && /^(move|funny|room)$/.test(e.tag || '');
  if (!isCmd || !STATS.sass) return false;
  const isWalk = e.actions.some(x => x.walk !== undefined);
  STATS.cmdTimes = STATS.cmdTimes.filter(x => now - x < 30); STATS.cmdTimes.push(now);
  let add = 9 + 5 * (STATS.cmdTimes.length - 1);                            // orders in a row add up
  if (e.match[0] === STATS.lastCmd && now - STATS.lastCmdT < 20) add += 8;  // the same order again
  if (/\b(please|pls|plz)\b/.test(q)) add -= 10;                            // manners help
  STATS.annoy = clampS(STATS.annoy + add * STATS.sass); STATS.focus = clampS(STATS.focus - 8);
  STATS.lastCmd = e.match[0]; STATS.lastCmdT = now;
  if (isWalk) { STATS.walkTimes = STATS.walkTimes.filter(x => now - x < 45); STATS.walkTimes.push(now); }
  let d = 'obey';
  if (isWalk && (STATS.walkTimes.length >= 4 || (STATS.annoy > 60 && STATS.walkTimes.length >= 2))) d = 'hostage';
  else if (STATS.annoy > 75) d = pick(STATS.wild ? ['cross', 'tap', 'throw'] : ['cross', 'cross', 'tap']);
  else if (STATS.energy < 15 && (isWalk || e.tag === 'funny')) d = 'tired';
  if (d === 'obey') return false;
  window.AIWorld.stop();
  if (d === 'hostage') { STATS.walkTimes = []; window.AIWorld.act([{ hostage: 'glass' }]); }
  else if (d === 'tired') { setMood('unimpressed', 1, 4); say(pick(LINES.tired)); window.AIWorld.act([{ sit: 'sofa', time: 10 }]); }
  else { window.AIWorld.act([{ rebel: d }]); STATS.annoy = clampS(STATS.annoy - 40); }
  return true;
}
function autoTick() {
  if (!STATS.auto || !loaded || act.cur || act.queue.length || STATS.hostage || FX.talking || busyTalking()) { if (FX.talking || busyTalking()) STATS.lastInput = STATS.now; return; }
  const now = STATS.now, idleFor = now - STATS.lastInput;

//   One open line to Google's Gemini Live: your voice goes up while you talk, her voice comes back
//   while it is being made. No "speech -> text -> brain -> voice" waiting. Talk over her and she stops.
//   - Brain.py /live_token gives a short-lived Google token (the real key never comes to this page)
//     plus her personality, today's memory and her old lines (so she stays the same girl and does not repeat).
//   - Her voice plays through the same sound path as before, so her mouth follows the real sound.
//   - Tool "room_action": she moves and changes face while she talks (walk, sit, lamp, tv, ...).
//   - Tool "think_hard": hard questions go to her big brain (Claude, via Brain.py /think); she says the answer.
//   - Every finished turn goes to Brain.py /live_log (day memory + no-repeat list).
//   Turn it on/off in the API key box: "Live chat engine". The old engine (mic -> Whisper -> brain) still works.
//   Console: AIWorld.geminiLive.start() / .stop() / .bargeLevel = 0.06 (lower = easier to interrupt her)
// ============================================================================
(function () {
  const BRAIN = 'http://localhost:5005';
  const GL = { on: false, ws: null, ready: false, ctx: null, mic: null, node: null, sink: null, src: null,
    playAt: 0, nodes: [], userText: '', herText: '', handle: null, plain: false, closing: false, retries: 0,
    bargeLevel: 0.07, greet: true, engine: null, startedAt: 0, lastAudioAt: 0 };
  const liveBtn = document.getElementById('live');
  const status = (s) => { if (liveBtn) { liveBtn.textContent = s; liveBtn.classList.toggle('rec', GL.on); } };
  const herTalking = () => GL.nodes.length > 0;

  // ---- which engine? asked from Brain.py settings (default: Gemini Live when a Gemini key is saved)
  async function engine() {
    try {
      const j = await (await fetch(BRAIN + '/settings', { cache: 'no-store' })).json();
      GL.engine = (j.live_engine === 'old' || !j.gemini_key) ? 'old' : 'gemini';
    } catch (e) { GL.engine = 'old'; }
    return GL.engine;
  }

  // ---- mic: 16 kHz, 16-bit PCM in small pieces (about 40 ms), made in an AudioWorklet (its own audio thread)
  const WORKLET = `
  class MicPcm extends AudioWorkletProcessor {
    constructor() { super(); this.step = sampleRate / 16000; this.pos = 0; this.buf = new Int16Array(640); this.n = 0; this.sum = 0; }
    process(inputs) {
      const ch = inputs[0] && inputs[0][0]; if (!ch) return true;
      for (; this.pos < ch.length; this.pos += this.step) {
        const s = Math.max(-1, Math.min(1, ch[Math.floor(this.pos)]));
        this.sum += s * s; this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
        if (this.n === this.buf.length) {
          this.port.postMessage({ pcm: this.buf.buffer, rms: Math.sqrt(this.sum / this.n) }, [this.buf.buffer]);
          this.buf = new Int16Array(640); this.n = 0; this.sum = 0;
        }
      }
      this.pos -= ch.length; return true;
    }
  }
  registerProcessor('mic-pcm', MicPcm);`;
  const b64 = (buf) => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (str) => { const s = atob(str), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; };

  async function startMic() {
    GL.ctx = voiceCtx();                                   // the same audio system as her voice (face follows it)
    GL.mic = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    if (!GL.ctx.__micPcm) { await GL.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }))); GL.ctx.__micPcm = true; }
    GL.src = GL.ctx.createMediaStreamSource(GL.mic);
    GL.node = new AudioWorkletNode(GL.ctx, 'mic-pcm');
    GL.sink = GL.ctx.createGain(); GL.sink.gain.value = 0;   // the worklet must be in the graph to run; this keeps it silent
    GL.src.connect(GL.node); GL.node.connect(GL.sink); GL.sink.connect(GL.ctx.destination);
    GL.node.port.onmessage = (ev) => {
      if (!GL.ready || !GL.ws || GL.ws.readyState !== 1) return;
      let pcm = ev.data.pcm;
      // her own voice coming back through the speakers must not count as you talking:
      // while she talks, only a clearly louder voice (you, close to the mic) gets through
      if (herTalking() && ev.data.rms < GL.bargeLevel) pcm = new ArrayBuffer(pcm.byteLength);
      GL.ws.send(JSON.stringify({ realtimeInput: { audio: { data: b64(pcm), mimeType: 'audio/pcm;rate=16000' } } }));
    };
  }
  function stopMic() {
    try { GL.node && (GL.node.port.onmessage = null); GL.src && GL.src.disconnect(); GL.node && GL.node.disconnect(); GL.sink && GL.sink.disconnect(); } catch (e) {}
    try { GL.mic && GL.mic.getTracks().forEach(t => t.stop()); } catch (e) {}
    GL.mic = GL.src = GL.node = GL.sink = null;
  }

  // ---- her voice: 24 kHz PCM pieces, played back to back through VOICE.analyser (so the mouth moves with it)
  function playPcm(buf, rate) {
    const ctx = GL.ctx || voiceCtx(), i16 = new Int16Array(buf), f = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f[i] = i16[i] / 32768;
    const ab = ctx.createBuffer(1, f.length, rate); ab.copyToChannel(f, 0);
    const s = ctx.createBufferSource(); s.buffer = ab; s.connect(VOICE.analyser);
    const at = Math.max(ctx.currentTime + 0.03, GL.playAt); s.start(at); GL.playAt = at + ab.duration;
    GL.nodes.push(s); VOICE.src = s; FX.talking = true; GL.lastAudioAt = performance.now();
    s.onended = () => {
      GL.nodes = GL.nodes.filter(n => n !== s);
      if (GL.nodes.length) VOICE.src = GL.nodes[GL.nodes.length - 1];
      else { if (VOICE.src === s) VOICE.src = null; FX.talking = false; if (GL.on) status('Live: listening…'); }
    };
  }
  function cutVoice() {                                    // you talked over her: stop at once, drop what was waiting
    const list = GL.nodes; GL.nodes = [];
    for (const s of list) { try { s.onended = null; s.stop(); } catch (e) {} }
    if (list.includes(VOICE.src)) VOICE.src = null;
    FX.talking = false; GL.playAt = 0;
  }

  // ---- tools she can call while she talks
  const EMO = ['neutral', 'happy', 'amused', 'annoyed', 'confused', 'sad', 'surprised'];
  function tools(acts, plain) {
    const fns = [
      { name: 'room_action',
        description: 'Move your body in the room and/or change your face. Call it while you talk when your words say you do something, or when your mood clearly changes.',
        parameters: { type: 'OBJECT', properties: {
          actions: { type: 'ARRAY', description: 'Steps in order. Empty for face only.', items: { type: 'OBJECT', properties: {
            do: { type: 'STRING', enum: acts.filter(a => a !== 'none') },
            target: { type: 'STRING', description: 'walk: sofa, window, plant, tv, table, ball, shelf, center, front. sit: sofa or miss. point: tv, sofa, plant, window, table, ball, shelf, board, lamp' },
            text: { type: 'STRING', description: 'for tv_text, write_board, explain, open_memory' } }, required: ['do'] } },
          emotion: { type: 'STRING', enum: EMO } } } },
      { name: 'think_hard',
        description: 'Ask your big smart brain. Use it for real facts, numbers, maths, code, news, or anything you are not sure about. Say a short line first, then call it.',
        parameters: { type: 'OBJECT', properties: { question: { type: 'STRING', description: 'The full question, with what the person wants to know.' } }, required: ['question'] } },
    ];
    const t = [{ functionDeclarations: fns }];
    if (!plain) t.push({ googleSearch: {} });
    return t;
  }
  async function onToolCall(tc) {
    const out = [];
    for (const fc of tc.functionCalls || []) {
      const args = fc.args || {};
      if (fc.name === 'room_action') {
        if (args.emotion) setMood(args.emotion);
        const acts = Array.isArray(args.actions) ? brainActs(args.actions.map(a => ({ do: a.do, target: a.target || '', text: a.text || '' }))) : [];
        if (acts.length) { window.AIWorld.stop(); window.AIWorld.act(acts); }
        out.push({ id: fc.id, name: fc.name, response: { result: 'ok, doing it' } });
      } else if (fc.name === 'think_hard') {
        status('Live: thinking hard…'); setMood('confused', 0.6, 4);
        let result;
        try {
          const j = await (await fetch(BRAIN + '/think', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: args.question || GL.userText }) })).json();
          result = j.answer ? { answer: j.answer } : { error: j.error || 'no answer' };
        } catch (e) { result = { error: 'big brain not reachable' }; }
        out.push({ id: fc.id, name: fc.name, response: result });
      } else out.push({ id: fc.id, name: fc.name, response: { error: 'unknown tool' } });
    }
    if (GL.ws && GL.ws.readyState === 1) GL.ws.send(JSON.stringify({ toolResponse: { functionResponses: out } }));
  }

  // ---- one finished turn: show it, remember it
  function endTurn() {
    const user = GL.userText.trim(), her = GL.herText.trim();
    GL.userText = ''; GL.herText = '';
    if (!user && !her) return;
    if (user) { console.log('live heard:', user); if (typeof sayEl !== 'undefined' && sayEl) sayEl.placeholder = 'you said: ' + user; }
    if (her) { try { SAID3.add(her); } catch (e) {} }
    fetch(BRAIN + '/live_log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, her }) }).catch(() => {});
  }

  async function onMessage(ev) {
    let m; try { m = JSON.parse(typeof ev.data === 'string' ? ev.data : await ev.data.text()); } catch (e) { return; }
    if (m.setupComplete) {
      GL.ready = true; GL.retries = 0; status('Live: listening…'); console.log('Gemini Live: connected' + (GL.plain ? ' (plain setup)' : ''));
      if (GL.greet && !GL.handle) { GL.greet = false; GL.ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text: '(The person just started a live voice call with you. Greet them with one short, fresh roast.)' }] }], turnComplete: true } })); }
      return;
    }
    if (m.sessionResumptionUpdate && m.sessionResumptionUpdate.newHandle) GL.handle = m.sessionResumptionUpdate.newHandle;
    if (m.goAway) { console.log('Gemini Live: line ends soon, reconnecting'); reconnect(); return; }
    if (m.toolCall) { onToolCall(m.toolCall); return; }
    const sc = m.serverContent; if (!sc) return;
    if (sc.interrupted) { cutVoice(); endTurn(); status('Live: listening…'); }
    if (sc.inputTranscription && sc.inputTranscription.text) { GL.userText += sc.inputTranscription.text; if (!herTalking()) status('Live: hearing you…'); }
    if (sc.outputTranscription && sc.outputTranscription.text) { GL.herText += sc.outputTranscription.text; showBubble(GL.herText.trim(), 30); }
    for (const p of (sc.modelTurn && sc.modelTurn.parts) || []) {
      if (p.inlineData && /^audio\/pcm/.test(p.inlineData.mimeType || '')) {
        const rate = +(/rate=(\d+)/.exec(p.inlineData.mimeType) || [0, 24000])[1];
        playPcm(unb64(p.inlineData.data), rate); status('Live: talking…');
      }
    }
    if (sc.turnComplete) endTurn();
  }

  async function connect() {
    status('Live: connecting…');
    const r = await fetch(BRAIN + '/live_token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ context: roomNow() }) });
    const j = await r.json();
    if (!r.ok || !j.token) throw new Error(j.error || 'no live token');
    const url = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.' + (j.api_version || 'v1beta')
      + '.GenerativeService.BidiGenerateContentConstrained?access_token=' + encodeURIComponent(j.token);
    const ws = new WebSocket(url); GL.ws = ws; GL.ready = false;
    const setup = { model: 'models/' + j.model,
      generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: j.voice } } } },
      systemInstruction: { parts: [{ text: j.system }] }, tools: tools(j.actions || [], GL.plain),
      inputAudioTranscription: {}, outputAudioTranscription: {}, sessionResumption: GL.handle ? { handle: GL.handle } : {} };
    if (!GL.plain) setup.contextWindowCompression = { slidingWindow: {} };
    ws.onopen = () => ws.send(JSON.stringify({ setup }));
    ws.onmessage = onMessage;
    ws.onerror = () => console.warn('Gemini Live: line error');
    ws.onclose = (e) => {
      if (GL.ws !== ws) return;
      const wasReady = GL.ready; GL.ready = false; GL.ws = null;
      if (!GL.on || GL.closing) return;
      console.warn('Gemini Live closed', e.code, e.reason);
      if (!wasReady && !GL.plain) { GL.plain = true; console.warn('Gemini Live: trying again with a plain setup'); reconnect(); return; }   // Google refused an extra (search, compression): drop extras
      if (++GL.retries > 3) { stop(); sayMain('My live line keeps dropping. ' + (e.reason ? 'Google says: ' + e.reason : 'Check the Gemini key and the internet.')); return; }
      reconnect();
    };
  }
  async function reconnect() {
    const old = GL.ws; GL.ws = null; GL.ready = false;
    try { old && old.close(); } catch (e) {}
    try { await connect(); } catch (e) { stop(); sayMain('Live chat could not reconnect: ' + e.message); }
  }

  async function start() {
    if (GL.on) return true;
    GL.on = true; GL.closing = false; GL.greet = true; GL.handle = null; GL.plain = false; GL.retries = 0; GL.startedAt = Date.now();
    try { stopVoices(); } catch (e) {}
    try { await startMic(); }
    catch (e) { GL.on = false; status('Live chat'); sayMain("I need the microphone for live chat. Allow it in the browser."); return false; }
    try { await connect(); }
    catch (e) {
      console.warn('Gemini Live could not start:', e); stopMic(); GL.on = false; status('Live chat');
      showBubble('Gemini Live could not start: ' + e.message + ' — using the old live chat.', 8);
      try { return await window.AIWorld.live.start(); } catch (e2) { return false; }
    }
    return true;
  }
  function stop() {
    GL.closing = true; GL.on = false; GL.ready = false;
    endTurn(); cutVoice(); stopMic();
    try { GL.ws && GL.ws.close(); } catch (e) {} GL.ws = null;
    status('Live chat');
  }

  // the Live chat button: Gemini Live when chosen, else the old engine (its own click handler runs as before)
  if (liveBtn) liveBtn.addEventListener('click', async (ev) => {
    if (GL.on) { ev.stopImmediatePropagation(); stop(); return; }
    if (window.AIWorld.live && window.AIWorld.live.isOn()) return;            // old engine is on: its handler turns it off
    ev.stopImmediatePropagation();
    if ((await engine()) === 'gemini') start(); else window.AIWorld.live.start();
  }, true);

  // the Stop / voice-change paths also cut her live voice
  const _stopVoices = stopVoices;
  stopVoices = function () { cutVoice(); return _stopVoices.apply(this, arguments); };
  // typed text while the live line is open goes into the same live talk (fast, same memory)
  const _hear = window.AIWorld.hear;
  window.AIWorld.hear = function (text) {
    if (GL.on && GL.ready && GL.ws) { GL.userText += text; GL.ws.send(JSON.stringify({ realtimeInput: { text: String(text) } })); return null; }
    return _hear.apply(this, arguments);
  };
  function typedLive(ev) {                                 // Send button / Enter key while the live line is open
    if (!(GL.on && GL.ready && GL.ws) || typeof sayEl === 'undefined' || !sayEl) return;
    if (ev.type === 'keydown' && ev.key !== 'Enter') return;
    const t = sayEl.value.trim(); if (!t) return;
    ev.stopImmediatePropagation(); ev.preventDefault(); sayEl.value = ''; window.AIWorld.hear(t);
  }
  if (typeof sendEl !== 'undefined' && sendEl) sendEl.addEventListener('click', typedLive, true);
  if (typeof sayEl !== 'undefined' && sayEl) sayEl.addEventListener('keydown', typedLive, true);

  window.AIWorld.geminiLive = { start, stop, isOn: () => GL.on, state: () => ({ on: GL.on, ready: GL.ready, engine: GL.engine, plain: GL.plain, talking: herTalking() }),
    get bargeLevel() { return GL.bargeLevel; }, set bargeLevel(v) { GL.bargeLevel = Math.max(0, +v || 0); } };
})();
</script>
</body>
</html>
